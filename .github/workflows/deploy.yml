name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set Vite base path
        env:
          CONFIGURED_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: |
          if [ -n "$CONFIGURED_BASE_PATH" ]; then
            echo "VITE_BASE_PATH=$CONFIGURED_BASE_PATH" >> "$GITHUB_ENV"
          elif [ -f CNAME ]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi
      - name: Set Supabase frontend config
        env:
          SUPABASE_URL_SECRET: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY_SECRET: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL_SECRET" ]; then
            echo "VITE_SUPABASE_URL=$SUPABASE_URL_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$SUPABASE_ANON_KEY_SECRET" ]; then
            echo "VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY_SECRET" >> "$GITHUB_ENV"
          fi
      - name: Verify Supabase frontend config
        run: |
          if [ -z "${VITE_SUPABASE_URL:-}" ] && ! grep -Eq '^VITE_SUPABASE_URL=.+$' .env; then
            echo "Missing VITE_SUPABASE_URL: add it to the .env file or GitHub Actions secrets."
            exit 1
          fi
          if [ -z "${VITE_SUPABASE_ANON_KEY:-}" ] && ! grep -Eq '^VITE_SUPABASE_ANON_KEY=.+$' .env; then
            echo "Missing VITE_SUPABASE_ANON_KEY: add it to the .env file or GitHub Actions secrets."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
